name: Archive repository usage

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-usage-archive
  cancel-in-progress: false

jobs:
  archive:
    if: github.repository == 'AdamLiang42/SynResLoadPattern'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Read the collector at this run's commit via the API. No git checkout means
      # this workflow does not add a clone to the statistics it is measuring.
      - name: Load collector
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/scripts/archive_traffic.py?ref=$GITHUB_SHA" \
            > "$RUNNER_TEMP/archive_traffic.py"

      - name: Archive traffic and release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          python3 "$RUNNER_TEMP/archive_traffic.py" \
            --repo "$GITHUB_REPOSITORY" \
            --branch traffic-data \
            --output-dir "$RUNNER_TEMP/traffic-output" \
            --publish
